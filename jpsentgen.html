<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Sentence Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">

        <header class="text-center py-4 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800">AI Language Sentence Generator</h1>
            <p class="text-sm text-gray-500">Generates dynamic sentences using Gemini AI</p>
        </header>

        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl shadow-sm">
            <label class="block text-xs font-bold text-amber-800 uppercase mb-2">1. Select AI Provider &amp; API Key File:</label>
            <div class="flex gap-4 mb-3">
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="provider" value="gemini" checked onchange="setProvider('gemini')" class="accent-amber-600">
                    <span class="text-sm font-medium text-amber-800">Gemini</span>
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="provider" value="claude" onchange="setProvider('claude')" class="accent-amber-600">
                    <span class="text-sm font-medium text-amber-800">Claude</span>
                </label>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="loadKeyFile()" class="bg-amber-600 hover:bg-amber-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition-colors">
                    📁 Select Key File
                </button>
                <span id="keyStatus" class="text-xs text-amber-700 italic">No file selected (Please select a .txt file containing your API key)</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 space-y-6">

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <label for="phraseInput" class="block text-sm font-semibold text-gray-700 mb-2">2. Enter Phrase:</label>
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <input type="text" id="phraseInput" placeholder="e.g., さくら, ラーメン, 朋友" maxlength="50"
                                class="w-full pl-4 pr-10 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
                            <button onclick="clearInputPhrase()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-lg" id="clearPhraseBtn" style="display: none;" title="Clear phrase">✕</button>
                        </div>
                        <button id="genBtn" onclick="generateSentence()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium transition-colors shrink-0">Generate</button>
                    </div>
                    <div class="flex justify-between items-center mt-1">
                        <p id="inputError" class="text-xs text-red-600 hidden"></p>
                        <p id="charCount" class="text-xs text-gray-400 ml-auto">0 / 50</p>
                    </div>
                </div>

                <div id="outputCard" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hidden space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-800">Generated Result</h2>
                        <div class="flex gap-2">
                            <button id="negateBtn" onclick="negateSentence()" class="inline-flex items-center gap-1 bg-red-50 hover:bg-red-100 text-red-700 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">
                                🚫 Negate
                            </button>
                            <button onclick="speakText(currentSentenceText)" class="inline-flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">
                                🔊 Read Aloud
                            </button>
                        </div>
                    </div>

                    <div id="correctionNotice" class="hidden bg-yellow-50 border border-yellow-200 rounded-lg px-4 py-2 text-sm text-yellow-800">
                        ✏️ Corrected: <span id="correctionOriginal" class="font-mono line-through text-gray-500"></span> → <span id="correctionFixed" class="font-mono font-bold text-indigo-700"></span>
                    </div>

                    <div class="grid grid-cols-1 gap-2 border-t border-gray-100 pt-4 font-mono text-sm">
                        <div class="flex items-start">
                            <span class="w-20 font-bold text-gray-500 shrink-0">hiragan:</span>
                            <span id="outHiragana" class="text-gray-800 font-sans text-base"></span>
                        </div>
                        <div class="flex items-start">
                            <span class="w-20 font-bold text-gray-500 shrink-0">katakana:</span>
                            <span id="outKatakana" class="text-gray-800 font-sans text-base"></span>
                        </div>
                        <div class="flex items-start">
                            <span class="w-20 font-bold text-gray-500 shrink-0">roman:</span>
                            <span id="outRoman" class="text-gray-700 font-sans text-base lowercase"></span>
                        </div>
                        <div class="flex items-start">
                            <span class="w-20 font-bold text-gray-500 shrink-0">cn:</span>
                            <span id="outCn" class="text-gray-800 font-sans text-base"></span>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-semibold text-gray-700">Writing Practice Canvas</label>
                        <button onclick="clearCanvas()" class="text-sm text-red-600 hover:text-red-700 font-medium">Clear Canvas</button>
                    </div>
                    <div class="border border-gray-200 rounded-lg bg-gray-50 overflow-hidden touch-none">
                        <canvas id="practiceCanvas" class="w-full h-64 bg-white cursor-crosshair"></canvas>
                    </div>
                </div>

            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit space-y-4">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h2 class="text-lg font-bold text-gray-800">History Log</h2>
                    <button onclick="clearHistory()" class="text-xs text-red-500 hover:text-red-700 font-medium">Clear All</button>
                </div>
                <div id="historyList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1 text-sm text-gray-500">
                    <p id="emptyHistory" class="italic text-center py-4">No sentences generated yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let apiKey = "";
        let provider = "gemini";
        let currentSentenceText = "";
        let currentInputPhrase = "";

        function setProvider(value) {
            provider = value;
            apiKey = "";
            document.getElementById('keyStatus').textContent = "No file selected (Please select a .txt file containing your API key)";
            document.getElementById('keyStatus').className = "text-xs text-amber-700 italic";
        }
        let historyData = [];

        // --- Canvas Setup ---
        const canvas = document.getElementById('practiceCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 256;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#1e293b';
        }
        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            loadHistoryFromStorage();

            const phraseInput = document.getElementById('phraseInput');
            const clearPhraseBtn = document.getElementById('clearPhraseBtn');

            phraseInput.addEventListener('input', () => {
                clearInputError();
                const len = phraseInput.value.length;
                document.getElementById('charCount').textContent = `${len} / 50`;
                clearPhraseBtn.style.display = phraseInput.value.trim().length > 0 ? "block" : "none";
            });

            phraseInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') generateSentence();
            });
        });

        // --- Input Validation ---
        function validateInput(value) {
            const trimmed = value.trim();

            if (!trimmed) {
                return { valid: false, message: "Please enter a phrase." };
            }
            if (trimmed.length > 50) {
                return { valid: false, message: `Phrase is too long (${trimmed.length}/50 characters).` };
            }

            // Must contain at least one linguistic character:
            // Latin letters, Hiragana, Katakana, Kanji (CJK), or half-width Katakana
            const hasValidChar = /[a-zA-Z぀-ゟ゠-ヿ一-鿿㐀-䶿･-ﾟ]/.test(trimmed);
            if (!hasValidChar) {
                return { valid: false, message: "Please enter a phrase with letters or Japanese/Chinese characters." };
            }

            return { valid: true, message: "" };
        }

        function showInputError(message) {
            const errorEl = document.getElementById('inputError');
            const inputEl = document.getElementById('phraseInput');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
            inputEl.classList.add('border-red-400', 'focus:ring-red-400');
            inputEl.classList.remove('border-gray-300');
        }

        function clearInputError() {
            const errorEl = document.getElementById('inputError');
            const inputEl = document.getElementById('phraseInput');
            errorEl.classList.add('hidden');
            inputEl.classList.remove('border-red-400', 'focus:ring-red-400');
            inputEl.classList.add('border-gray-300');
        }

        function showCorrectionNotice(original, corrected) {
            document.getElementById('correctionOriginal').textContent = original;
            document.getElementById('correctionFixed').textContent = corrected;
            document.getElementById('correctionNotice').classList.remove('hidden');
        }

        function hideCorrectionNotice() {
            document.getElementById('correctionNotice').classList.add('hidden');
        }

        function clearInputPhrase() {
            const phraseInput = document.getElementById('phraseInput');
            phraseInput.value = "";
            document.getElementById('charCount').textContent = "0 / 50";
            document.getElementById('clearPhraseBtn').style.display = "none";
            clearInputError();
            phraseInput.focus();
        }

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }
        function startDrawing(e) { isDrawing = true; draw(e); }
        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const { x, y } = getCoords(e);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        window.addEventListener('touchend', stopDrawing);

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function updateOutputDisplay(hiragana, katakana, roman, cn, sourcePhrase = "") {
            document.getElementById('outHiragana').textContent = hiragana;
            document.getElementById('outKatakana').textContent = katakana;
            document.getElementById('outRoman').textContent = roman.toLowerCase();
            document.getElementById('outCn').textContent = cn;

            currentSentenceText = hiragana;
            if (sourcePhrase) currentInputPhrase = sourcePhrase;
            document.getElementById('outputCard').classList.remove('hidden');
        }

        // --- Key File Reader ---
        async function loadKeyFile() {
            try {
                const [fileHandle] = await window.showOpenFilePicker({
                    types: [{
                        description: 'Text Files',
                        accept: { 'text/plain': ['.txt'] }
                    }],
                    multiple: false
                });

                const file = await fileHandle.getFile();
                const text = await file.text();
                apiKey = text.trim().replace(/[\r\n\t\s]/g, "");

                document.getElementById('keyStatus').textContent = `Loaded: ${file.name}`;
                document.getElementById('keyStatus').className = "text-xs text-green-600 font-medium";
            } catch (err) {
                if (err.name !== 'AbortError') alert("Failed to read key file.");
            }
        }

        // --- Generator Logic ---
        async function generateSentence() {
            const input = document.getElementById('phraseInput').value.trim();
            const btn = document.getElementById('genBtn');

            if (!apiKey) { alert("Please click 'Select Key File' to load your API key first."); return; }

            const validation = validateInput(input);
            if (!validation.valid) {
                showInputError(validation.message);
                document.getElementById('phraseInput').focus();
                return;
            }
            clearInputError();

            btn.disabled = true;
            btn.textContent = "Thinking...";

            const prompt = `The user wants a Japanese sentence using the phrase: "${input}".

Step 1 — Spell-check: Decide if "${input}" is correctly written Japanese. Only mark it invalid if it is a clear misspelling that does not form a real word or phrase (e.g. さもい instead of さむい). Do NOT flag valid but uncommon words.

Step 2 — Generate: Create a natural, short Japanese sentence using the corrected phrase (or the original if it was already correct).

Return ONLY a valid JSON object with these keys:
- "inputValid": true if the original input is correct, false if it was corrected
- "correctedInput": the corrected spelling when inputValid is false; otherwise repeat the original input exactly
- "hiragana": the complete sentence in pure hiragana (no kanji)
- "katakana": the complete sentence in pure katakana
- "roman": the complete sentence in lowercase Romanization with normal spaces between words
- "cn": the complete sentence translated into Traditional Chinese
Do not include any markdown styling or extra text outside the JSON structure.`;

            try {
                const result = await callAI(prompt);
                const effectiveInput = (!result.inputValid && result.correctedInput) ? result.correctedInput : input;
                if (!result.inputValid && result.correctedInput && result.correctedInput !== input) {
                    showCorrectionNotice(input, result.correctedInput);
                } else {
                    hideCorrectionNotice();
                }
                updateOutputDisplay(result.hiragana, result.katakana, result.roman, result.cn, effectiveInput);
                saveToHistory(effectiveInput, result);
            } catch (error) {
                console.error(error);
                alert("Failed to generate sentence. Please try again.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Generate";
            }
        }

        // --- Negation Feature Logic ---
        async function negateSentence() {
            const btn = document.getElementById('negateBtn');
            const currentHiragana = document.getElementById('outHiragana').textContent;

            if (!apiKey) { alert("Please click 'Select Key File' to load your API key first."); return; }
            if (!currentHiragana) { alert("Generate a sentence first before negating."); return; }

            btn.disabled = true;
            btn.textContent = "Negating...";

            const prompt = `Change the following Japanese sentence into its correct negative version: "${currentHiragana}".
Return the response ONLY as a valid JSON object with the keys "hiragana", "katakana", "roman", and "cn".
Rules:
- "hiragana": the complete negative sentence in pure hiragana (no kanji).
- "katakana": the complete negative sentence in pure katakana.
- "roman": the complete negative sentence in lowercase Romanization with normal spaces between words.
- "cn": the complete negative sentence translated into Traditional Chinese.
Do not include any markdown styling or extra text outside the JSON structure.`;

            try {
                hideCorrectionNotice();
                const result = await callAI(prompt);
                const trackingLabel = `${currentInputPhrase} (Negative)`;
                updateOutputDisplay(result.hiragana, result.katakana, result.roman, result.cn, trackingLabel);
                saveToHistory(trackingLabel, result);
            } catch (error) {
                console.error(error);
                alert("Failed to negate the sentence.");
            } finally {
                btn.disabled = false;
                btn.textContent = "🚫 Negate";
            }
        }

        // Walk the text char-by-char, tracking brace depth.
        // Each time a balanced {...} block closes, try JSON.parse on it.
        // Returns the first block that parses successfully, so stray {word}
        // fragments in Gemini's prose never swallow the real JSON object.
        function extractJSON(text) {
            let depth = 0, start = -1;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === '{') {
                    if (depth++ === 0) start = i;
                } else if (text[i] === '}' && depth > 0) {
                    if (--depth === 0) {
                        try { return JSON.parse(text.slice(start, i + 1)); }
                        catch (_) { start = -1; }
                    }
                }
            }
            throw new Error('No valid JSON found in response');
        }

        // --- Global Fetch Handlers ---
        function callAI(promptText) {
            return provider === 'claude' ? fetchFromClaude(promptText) : fetchFromGemini(promptText);
        }

        async function fetchFromGemini(promptText) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            return extractJSON(data.candidates[0].content.parts[0].text.trim());
        }

        async function fetchFromClaude(promptText) {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                    'anthropic-dangerous-direct-browser-access': 'true'
                },
                body: JSON.stringify({
                    model: 'claude-haiku-4-5-20251001',
                    max_tokens: 1024,
                    messages: [{ role: 'user', content: promptText }]
                })
            });
            const data = await response.json();
            if (data.type === 'error') throw new Error(data.error.message);
            return extractJSON(data.content[0].text.trim());
        }

        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            window.speechSynthesis.speak(utterance);
        }

        // --- Storage Management ---
        function loadHistoryFromStorage() {
            const stored = localStorage.getItem('lang_app_history');
            if (stored) {
                historyData = JSON.parse(stored);
                renderHistoryUI();
            }
        }

        function saveToHistory(input, result) {
            historyData.unshift({ input, ...result });
            localStorage.setItem('lang_app_history', JSON.stringify(historyData));
            renderHistoryUI();
        }

        function clearHistory() {
            if(confirm("Clear all historical records?")) {
                historyData = [];
                localStorage.removeItem('lang_app_history');
                renderHistoryUI();
            }
        }

        function deleteHistoryEntry(index) {
            historyData.splice(index, 1);
            localStorage.setItem('lang_app_history', JSON.stringify(historyData));
            renderHistoryUI();
        }

        function renderHistoryUI() {
            const historyList = document.getElementById('historyList');
            if (historyData.length === 0) {
                historyList.innerHTML = `<p id="emptyHistory" class="italic text-center py-4">No sentences generated yet.</p>`;
                return;
            }

            historyList.innerHTML = historyData.map((item, index) => `
                <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg hover:border-indigo-300 transition-colors cursor-pointer flex items-center gap-2"
                     onclick="updateOutputDisplay(\`${item.hiragana}\`, \`${item.katakana}\`, \`${item.roman}\`, \`${item.cn}\`, \`${item.input}\`)">
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-xs text-indigo-600">Input: ${item.input}</div>
                        <div class="text-gray-800 font-medium mt-0.5 truncate">${item.hiragana}</div>
                        <div class="text-xs text-gray-400 mt-0.5 truncate">${item.cn}</div>
                    </div>
                    <div class="flex flex-col gap-1 shrink-0">
                        <button onclick="event.stopPropagation(); deleteHistoryEntry(${index})"
                                class="p-1.5 bg-white border border-gray-200 text-gray-400 rounded-md hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition-all shadow-sm"
                                title="Delete this entry">✕</button>
                        <button onclick="event.stopPropagation(); speakText(\`${item.hiragana}\`)"
                                class="p-1.5 bg-white border border-gray-200 text-gray-500 rounded-md hover:bg-indigo-50 hover:text-indigo-600 transition-all shadow-sm"
                                title="Read this entry aloud">🔊</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
