<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日語句型練習 | Japanese Sentence Practice</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #3730a3;
  --primary-light: #4f46e5;
  --primary-faint: #eef2ff;
  --aff: #15803d;
  --aff-light: #dcfce7;
  --aff-border: #86efac;
  --neg: #b91c1c;
  --neg-light: #fee2e2;
  --neg-border: #fca5a5;
  --surface: #ffffff;
  --bg: #f8f9ff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* Header */
header {
  background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
  color: white;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(55,48,163,0.3);
}
header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.02em; }
header p { font-size: 0.85rem; opacity: 0.8; margin-top: 2px; }

.lang-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  transition: background 0.2s;
  white-space: nowrap;
}
.lang-btn:hover { background: rgba(255,255,255,0.35); }

/* Group tabs */
.group-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.group-nav::-webkit-scrollbar { display: none; }

.group-tab {
  background: none;
  border: none;
  padding: 14px 18px;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.group-tab:hover { color: var(--primary); }
.group-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

/* Controls bar */
.controls-bar {
  background: var(--surface);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}

.toggle-group {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}
.toggle-btn {
  border: none;
  background: transparent;
  padding: 7px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: all 0.2s;
}
.toggle-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
}
.toggle-btn.aff.active { color: var(--aff); }
.toggle-btn.neg.active { color: var(--neg); }

.sep { width: 1px; height: 28px; background: var(--border); }

/* Main content */
main { max-width: 900px; margin: 0 auto; padding: 24px; }

/* Section */
.section {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.section-header {
  padding: 14px 20px;
  background: var(--primary-faint);
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--primary);
}
.section-body { padding: 20px; }

/* Pattern box */
.pattern-box {
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin-bottom: 12px;
}
.pattern-box.aff { background: var(--aff-light); border: 1px solid var(--aff-border); }
.pattern-box.neg { background: var(--neg-light); border: 1px solid var(--neg-border); }

.pattern-formula {
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: 0.02em;
}
.pattern-box.aff .pattern-formula { color: var(--aff); }
.pattern-box.neg .pattern-formula { color: var(--neg); }

.pattern-formula-en {
  font-size: 0.875rem;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-style: italic;
}
.pattern-note {
  font-size: 0.875rem;
  color: var(--text);
  line-height: 1.5;
}

/* Conjugation table */
.conj-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
  margin-top: 4px;
}
.conj-table th {
  background: var(--primary-faint);
  color: var(--primary);
  padding: 8px 12px;
  text-align: left;
  font-weight: 700;
  border-bottom: 2px solid var(--border);
}
.conj-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.conj-table tr:last-child td { border-bottom: none; }
.conj-table tr:hover td { background: var(--bg); }

/* Vocabulary grid */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.vocab-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  text-align: center;
  cursor: default;
  transition: box-shadow 0.2s;
}
.vocab-card:hover { box-shadow: var(--shadow-md); }
.vocab-kanji {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 4px;
}
.vocab-reading {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 2px;
}
.vocab-romaji {
  font-size: 0.7rem;
  color: var(--text-light);
  font-style: italic;
  margin-bottom: 6px;
}
.vocab-meaning {
  font-size: 0.8rem;
  color: var(--primary);
  font-weight: 600;
  background: var(--primary-faint);
  border-radius: 4px;
  padding: 2px 6px;
  display: inline-block;
}

/* Sentence cards */
.sentence-card {
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  padding: 16px;
  margin-bottom: 12px;
  transition: box-shadow 0.2s;
}
.sentence-card:last-child { margin-bottom: 0; }
.sentence-card:hover { box-shadow: var(--shadow-md); }
.sentence-card.aff { border-left: 4px solid var(--aff); }
.sentence-card.neg { border-left: 4px solid var(--neg); }

.sentence-pair {
  margin-bottom: 16px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.sentence-pair:last-child { margin-bottom: 0; }
.sentence-pair > .sentence-card {
  border-radius: 0;
  border: none;
  border-left: 4px solid transparent;
  margin-bottom: 0;
}
.sentence-pair > .sentence-card:hover { box-shadow: none; }
.sentence-pair > .sentence-card.aff {
  border-left-color: var(--aff);
  background: var(--aff-light);
  border-bottom: 1px solid var(--border);
}
.sentence-pair > .sentence-card.neg {
  border-left-color: var(--neg);
  background: var(--neg-light);
}
.toggle-btn.both.active { color: var(--primary); }

.sentence-ja {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s, color 0.15s;
  padding: 2px 4px;
  margin-left: -4px;
}
.sentence-ja:hover { background: var(--primary-faint); color: var(--primary); }
.sentence-ja.flash {
  background: var(--primary);
  color: white;
}

.readings-table { width: 100%; }
.readings-table tr td { padding: 3px 0; vertical-align: top; }
.reading-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-light);
  width: 72px;
  padding-right: 10px;
}
.reading-value {
  font-size: 0.9rem;
  color: var(--text);
  font-family: 'Noto Sans JP', 'Noto Sans TC', monospace;
}
.reading-romaji { font-style: italic; color: var(--text-muted); }
.sentence-meaning {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Exercise */
.exercise-container { max-width: 640px; margin: 0 auto; }
.exercise-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.exercise-count {
  font-size: 0.875rem;
  color: var(--text-muted);
  font-weight: 600;
}
.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin: 0 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s;
}

.exercise-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 28px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.exercise-type-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 20px;
}
.exercise-type-badge.aff { background: var(--aff-light); color: var(--aff); }
.exercise-type-badge.neg { background: var(--neg-light); color: var(--neg); }
.exercise-type-badge.both { background: var(--primary-faint); color: var(--primary); }

.exercise-vocab-ja {
  font-size: 2rem;
  font-weight: 700;
  text-align: center;
  color: var(--text);
  margin-bottom: 4px;
}
.exercise-vocab-reading {
  text-align: center;
  font-size: 1rem;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.exercise-vocab-romaji {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-light);
  font-style: italic;
  margin-bottom: 4px;
}
.exercise-vocab-meaning {
  text-align: center;
  font-size: 1rem;
  color: var(--primary);
  font-weight: 600;
  margin-bottom: 28px;
}
.exercise-prompt {
  text-align: center;
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 20px;
  padding: 12px;
  background: var(--bg);
  border-radius: var(--radius-sm);
}

.reveal-btn {
  width: 100%;
  padding: 14px;
  border: 2px solid var(--primary);
  background: var(--primary-faint);
  color: var(--primary);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.reveal-btn:hover { background: var(--primary); color: white; }

.answer-box {
  margin-top: 20px;
  padding: 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  animation: fadeIn 0.3s ease;
}
.answer-box.aff { border-color: var(--aff-border); background: var(--aff-light); }
.answer-box.neg { border-color: var(--neg-border); background: var(--neg-light); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

.answer-ja {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 12px;
  text-align: center;
}
.answer-box.aff .answer-ja { color: var(--aff); }
.answer-box.neg .answer-ja { color: var(--neg); }
.answer-box.aff .sentence-ja:hover { background: rgba(21,128,61,0.12); color: var(--aff); }
.answer-box.neg .sentence-ja:hover { background: rgba(185,28,28,0.12); color: var(--neg); }

.exercise-nav {
  display: flex;
  gap: 12px;
}
.nav-btn {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-btn:hover { background: var(--primary-faint); border-color: var(--primary); color: var(--primary); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Type indicator dot */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot.aff { background: var(--aff); }
.dot.neg { background: var(--neg); }

/* Copy toast */
#copy-toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  background: #1e293b;
  color: white;
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 0.875rem;
  font-weight: 600;
  pointer-events: none;
  z-index: 9999;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  opacity: 1;
  transition: opacity 0.3s;
}

/* Help modal */
.help-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  overflow-y: auto;
  padding: 24px 16px;
}
.help-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
.help-modal {
  background: var(--surface);
  border-radius: var(--radius);
  max-width: 560px;
  width: 100%;
  box-shadow: var(--shadow-md);
  overflow: hidden;
  margin: auto;
}
.help-modal-header {
  background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
  color: white;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.help-modal-header h2 { font-size: 1.1rem; font-weight: 700; }
.help-close-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.help-close-btn:hover { background: rgba(255,255,255,0.35); }
.help-modal-body { padding: 24px; }
.help-section { margin-bottom: 24px; }
.help-section:last-child { margin-bottom: 0; }
.help-section h3 {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--primary);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--primary-faint);
}
.help-item {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
  align-items: flex-start;
}
.help-item:last-child { margin-bottom: 0; }
.help-icon {
  font-size: 1.1rem;
  width: 28px;
  flex-shrink: 0;
  text-align: center;
  margin-top: 1px;
}
.help-item-text { font-size: 0.875rem; line-height: 1.55; color: var(--text); }
.help-item-text strong { color: var(--text); font-weight: 700; }

/* Responsive */
@media (max-width: 600px) {
  header { padding: 16px; }
  header h1 { font-size: 1.1rem; }
  main { padding: 16px; }
  .group-nav { padding: 0 12px; }
  .controls-bar { padding: 12px 16px; gap: 10px; }
  .vocab-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .exercise-card { padding: 20px 16px; }
  .exercise-vocab-ja { font-size: 1.6rem; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hdr-title">日語句型練習</h1>
    <p id="hdr-subtitle">肯定句與否定句</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <a href="parser.html" class="lang-btn" style="text-decoration:none">🔍 句子拆解</a>
    <button class="lang-btn" onclick="toggleHelp()" id="help-btn">？ Help</button>
    <button class="lang-btn" id="lang-toggle-btn" onclick="toggleLang()">English</button>
  </div>
</header>

<div class="help-overlay" id="help-overlay" onclick="closeHelpOnBg(event)">
  <div class="help-modal" id="help-modal">
    <div class="help-modal-header">
      <h2 id="help-title">使用說明</h2>
      <button class="help-close-btn" onclick="toggleHelp()">✕</button>
    </div>
    <div class="help-modal-body" id="help-body"></div>
  </div>
</div>

<nav class="group-nav" id="group-nav"></nav>

<div class="controls-bar">
  <div class="toggle-group">
    <button class="toggle-btn active" id="mode-tutor" onclick="setMode('tutor')" data-i18n="modeTutor">學習模式</button>
    <button class="toggle-btn" id="mode-exercise" onclick="setMode('exercise')" data-i18n="modeExercise">練習模式</button>
  </div>
  <div class="sep"></div>
  <div class="toggle-group" id="sent-type-toggle">
    <button class="toggle-btn aff active" id="type-aff" onclick="setSentType('aff')" data-i18n="typeAff">肯定句</button>
    <button class="toggle-btn neg" id="type-neg" onclick="setSentType('neg')" data-i18n="typeNeg">否定句</button>
    <button class="toggle-btn both" id="type-both" onclick="setSentType('both')" data-i18n="typeBoth">兩者對照</button>
  </div>
</div>

<main id="main-content"></main>

<script>
// =====================================================================
// i18n
// =====================================================================
const i18n = {
  zh: {

    groupHint: { noun:'', iAdj:'', naAdj:'', verb1:'（る動詞）', verb2:'（う動詞）', verb3:'（する・くる）', adverb:'', exist:'（ある・いる）', tai:'（〜たい）', teiru:'（〜ています）', particle:'（は・が・を・に・で）', counter:'（〜本・〜枚・〜冊）', past:'（〜ました）', potential:'（〜できます）', request:'（〜てください）', experience:'（〜たことがある）', obligation:'（〜なければ）' },

      { heading: '其他設定', items: [
        { icon: '🌐', text: '<strong>語言切換</strong>：點選右上角按鈕，在中文與英文介面之間切換。' },

// =====================================================================
// App state
// =====================================================================
let lang = 'zh';

function t(key) { return i18n[lang][key] || key; }
function tm(obj) { return obj[lang] || obj.zh || ''; }

// =====================================================================
// Render helpers
// =====================================================================
function selectSentence(el) {
  const text = el.textContent.trim();

  // Desktop: select text
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 200);

  // Mobile + desktop: copy to clipboard and show toast
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showCopyToast()).catch(() => {});
  } else {
    showCopyToast();
  }
}

function showCopyToast() {
  const existing = document.getElementById('copy-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'copy-toast';
  toast.textContent = t('copied');
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 1800);
}

function readingsRow(hira, kata, rom) {
  return `<table class="readings-table">
    <tr><td class="reading-label">${t('hiragana')}</td><td class="reading-value">${hira}</td></tr>
    <tr><td class="reading-label">${t('katakana')}</td><td class="reading-value">${kata}</td></tr>
    <tr><td class="reading-label">${t('romaji')}</td><td class="reading-value reading-romaji">${rom}</td></tr>
  </table>`;
}

function sentenceCard(s, type) {
  return `<div class="sentence-card ${type}">
    <div class="sentence-ja" onclick="selectSentence(this)" title="Click to select">${s.ja}</div>
    ${readingsRow(s.hira, s.kata, s.rom)}
    <div class="sentence-meaning">${t('meaning')}：${tm(s.mean)}</div>
  </div>`;
}

function patternBox(g, type) {
  const p = g.pattern[type];
  return `<div class="pattern-box ${type}">
    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;opacity:.7">${type === 'aff' ? t('affLabel') : t('negLabel')}</div>
    <div class="pattern-formula">${p.formula}</div>
    <div class="pattern-formula-en">${p.formulaEn}</div>
    <div class="pattern-note">${tm(p.note)}</div>
  </div>`;
}

function conjTable(g) {
  if (!g.conj) return '';
  const hdrs = g.conj.headers[lang] || g.conj.headers.zh;
  let rows = g.conj.rows.map(r => {
    const cells = (r[lang] || r.zh).map(c => `<td>${c.replace(/　/g,'<br><small style="color:var(--text-muted)">') + '</small>'}</td>`).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  const thCells = hdrs.map(h => `<th>${h}</th>`).join('');
  return `<div class="section" style="margin-top:0">
    <div class="section-header">${t('secConj')}</div>
    <div class="section-body" style="padding:0;overflow-x:auto">
      <table class="conj-table">
        <thead><tr>${thCells}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// =====================================================================
// Tutor render
// =====================================================================
function renderTutor(g) {
  const vocabCards = g.vocab.map(v => `
    <div class="vocab-card">
      <div class="vocab-kanji">${v.kanji}</div>
      <div class="vocab-reading">${v.hira}</div>
      <div class="vocab-reading">${v.kata}</div>
      <div class="vocab-romaji">${v.rom}</div>
      <div class="vocab-meaning">${tm(v.mean)}</div>
    </div>`).join('');

  let sentCards, sectionTitle;
  if (sentType === 'both') {
    sentCards = g.sentences.aff.map((a, i) => {
      const n = g.sentences.neg[i];
      return `<div class="sentence-pair">${sentenceCard(a, 'aff')}${sentenceCard(n, 'neg')}</div>`;
    }).join('');
    sectionTitle = `${t('secExamples')} — ${t('typeAff')} / ${t('typeNeg')}`;
  } else {
    sentCards = g.sentences[sentType].map(s => sentenceCard(s, sentType)).join('');
    sectionTitle = `${t('secExamples')} — ${sentType === 'aff' ? t('typeAff') : t('typeNeg')}`;
  }

  return `
    <div class="section">
      <div class="section-header">${t('secPattern')}</div>
      <div class="section-body">
        ${patternBox(g, 'aff')}
        ${patternBox(g, 'neg')}
      </div>
    </div>
    ${conjTable(g)}
    <div class="section">
      <div class="section-header">${t('secVocab')}</div>
      <div class="section-body">
        <div class="vocab-grid">${vocabCards}</div>
      </div>
    </div>
    <div class="section">
      <div class="section-header">${sectionTitle}</div>
      <div class="section-body">${sentCards}</div>
    </div>`;
}

      const sn = matchSent(g.sentences.neg);
      answerHtml = `<div class="sentence-pair" style="margin-top:16px">
        <div class="answer-box aff" style="border-radius:0;border:none;border-left:4px solid var(--aff);border-bottom:1px solid var(--border)">
          <div class="answer-ja sentence-ja" onclick="selectSentence(this)" title="Click to select" style="color:var(--aff)">${sa.ja}</div>
          ${readingsRow(sa.hira, sa.kata, sa.rom)}
          <div class="sentence-meaning" style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.1)">${t('meaning')}：${tm(sa.mean)}</div>
        </div>
        <div class="answer-box neg" style="border-radius:0;border:none;border-left:4px solid var(--neg)">
          <div class="answer-ja sentence-ja" onclick="selectSentence(this)" title="Click to select" style="color:var(--neg)">${sn.ja}</div>
          ${readingsRow(sn.hira, sn.kata, sn.rom)}
          <div class="sentence-meaning" style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.1)">${t('meaning')}：${tm(sn.mean)}</div>
        </div>
      </div>`;
    } else {
      const ms = matchSent(g.sentences[sentType]);
      answerHtml = `<div class="answer-box ${sentType}">
        <div class="answer-ja sentence-ja" onclick="selectSentence(this)" title="Click to select">${ms.ja}</div>
        ${readingsRow(ms.hira, ms.kata, ms.rom)}
        <div class="sentence-meaning" style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.1)">${t('meaning')}：${tm(ms.mean)}</div>
      </div>`;
    }
  }

  return `<div class="exercise-container">
    <div class="exercise-progress">
      <span class="exercise-count">${t('exerQ')} ${exerIdx + 1} / ${total}</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="exercise-card">
      <span class="exercise-type-badge ${badgeClass}">${badgeLabel}</span>
      <div class="exercise-vocab-ja">${item.kanji}</div>
      <div class="exercise-vocab-reading">${item.hira}　${item.kata}</div>
      <div class="exercise-vocab-romaji">${item.rom}</div>
      <div class="exercise-vocab-meaning">${tm(item.mean)}</div>
      <div class="exercise-prompt">${prompt}</div>
      <button class="reveal-btn" onclick="toggleReveal()">${exerRevealed ? t('exerHide') : t('exerReveal')}</button>
      ${answerHtml}
    </div>
    <div class="exercise-nav">
      <button class="nav-btn" onclick="exerNav(-1)" ${exerIdx === 0 ? 'disabled' : ''}>${t('exerPrev')}</button>
      <button class="nav-btn" onclick="exerNav(1)" ${exerIdx === total - 1 ? 'disabled' : ''}>${t('exerNext')}</button>
    </div>
  </div>`;
}

// =====================================================================
// Main render
// =====================================================================
function render() {
  const g = groups.find(x => x.id === activeGroup);
  if (!g) return;
  const content = mode === 'tutor' ? renderTutor(g) : renderExercise(g);
  document.getElementById('main-content').innerHTML = content;
}

function renderGroupNav() {
  const nav = document.getElementById('group-nav');
  nav.innerHTML = groups.map(g => {
    const hint = t('groupHint')[g.id] ? `<span style="font-size:.7rem;opacity:.65"> ${t('groupHint')[g.id]}</span>` : '';
    return `<button class="group-tab ${g.id === activeGroup ? 'active' : ''}" onclick="setGroup('${g.id}')">
      ${g.icon} ${t(g.nameKey)}${hint}
    </button>`;
  }).join('');
}

function renderHeader() {
  document.getElementById('hdr-title').textContent = t('appTitle');
  document.getElementById('hdr-subtitle').textContent = t('appSubtitle');
  document.getElementById('lang-toggle-btn').textContent = t('langToggle');
  document.getElementById('help-btn').textContent = t('helpBtn');
  const overlay = document.getElementById('help-overlay');
  if (overlay.classList.contains('open')) renderHelp();
  document.getElementById('mode-tutor').textContent = t('modeTutor');
  document.getElementById('mode-exercise').textContent = t('modeExercise');
  document.getElementById('type-aff').textContent = t('typeAff');
  document.getElementById('type-neg').textContent = t('typeNeg');
  document.getElementById('type-both').textContent = t('typeBoth');
  document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
}

function fullRender() {
  renderHeader();
  renderGroupNav();
  render();
}

// =====================================================================
// Actions
// =====================================================================
function toggleHelp() {
  const overlay = document.getElementById('help-overlay');
  overlay.classList.toggle('open');
  if (overlay.classList.contains('open')) renderHelp();
}

function closeHelpOnBg(e) {
  if (e.target === document.getElementById('help-overlay')) toggleHelp();
}

function renderHelp() {
  document.getElementById('help-title').textContent = t('helpTitle');
  document.getElementById('help-btn').textContent = t('helpBtn');
  const sections = t('helpContent').map(sec => {
    const items = sec.items.map(item =>
      `<div class="help-item"><div class="help-icon">${item.icon}</div><div class="help-item-text">${item.text}</div></div>`
    ).join('');
    return `<div class="help-section"><h3>${sec.heading}</h3>${items}</div>`;
  }).join('');
  document.getElementById('help-body').innerHTML = sections;
}

function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  fullRender();
}

function setGroup(id) {
  activeGroup = id;
  exerIdx = 0;
  exerRevealed = false;
  renderGroupNav();
  render();
}

function setMode(m) {
  mode = m;
  exerIdx = 0;
  exerRevealed = false;
  document.getElementById('mode-tutor').classList.toggle('active', m === 'tutor');
  document.getElementById('mode-exercise').classList.toggle('active', m === 'exercise');
  render();
}

function setSentType(t) {
  sentType = t;
  exerIdx = 0;
  exerRevealed = false;
  document.getElementById('type-aff').classList.toggle('active', t === 'aff');
  document.getElementById('type-neg').classList.toggle('active', t === 'neg');
  document.getElementById('type-both').classList.toggle('active', t === 'both');
  render();
}

function toggleReveal() {
  exerRevealed = !exerRevealed;
  render();
}

function exerNav(dir) {
  const g = groups.find(x => x.id === activeGroup);
  exerIdx = Math.max(0, Math.min(g.vocab.length - 1, exerIdx + dir));
  exerRevealed = false;
  render();
}

// =====================================================================
// Init
// =====================================================================
fullRender();
</script>
</body>
</html>
