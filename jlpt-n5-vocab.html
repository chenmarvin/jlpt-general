<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N5 単語練習</title>
<style>
:root {
  --red:#DC143C; --red-l:#fff0f3; --red-d:#a50029;
  --bg:#f4f6f9; --text:#1a1a2e; --text2:#6b7280;
  --bdr:#e5e7eb; --grn:#10b981; --ylw:#f59e0b; --err:#ef4444;
  --shd:0 4px 20px rgba(0,0,0,0.07); --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
button,a,[onclick]{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
#app{max-width:620px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.screen{display:none;flex-direction:column;flex:1;padding:16px 20px 24px;}
.screen.active{display:flex;}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:8px 0 16px;}
.hdr h2{font-size:1.25rem;font-weight:700;}
.back-btn{background:none;border:none;font-size:1.5rem;cursor:pointer;padding:2px 8px;border-radius:8px;}
.back-btn:hover{background:rgba(0,0,0,0.06);}

/* home */
.home-hero{text-align:center;padding:28px 0 20px;}
.home-hero .ja-sub{font-size:.9rem;color:var(--text2);letter-spacing:.08em;}
.home-hero h1{font-size:2.1rem;font-weight:900;color:var(--red);margin:6px 0 4px;line-height:1.1;}
.home-hero .sub{font-size:.82rem;color:var(--text2);}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px;}
.mode-btn{background:white;border:2px solid var(--bdr);border-radius:var(--r);padding:18px 12px;cursor:pointer;text-align:center;transition:all .18s;box-shadow:var(--shd);}
.mode-btn:hover{border-color:var(--red);}
.mode-btn:active{opacity:.85;}
.m-icon{font-size:1.9rem;margin-bottom:6px;}
.m-label{font-weight:700;font-size:.92rem;}
.m-desc{font-size:.72rem;color:var(--text2);margin-top:3px;}
.sec-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sec-btn{background:white;border:2px solid var(--bdr);border-radius:12px;padding:13px;cursor:pointer;font-weight:600;font-size:.88rem;transition:all .18s;box-shadow:var(--shd);}
.sec-btn:hover{border-color:var(--red);}
.home-score{background:white;border-radius:12px;padding:14px 16px;margin-top:12px;border:2px solid var(--bdr);box-shadow:var(--shd);}
.home-score .lbl{font-size:.78rem;color:var(--text2);font-weight:600;margin-bottom:7px;}
.prog-wrap{background:#eee;border-radius:99px;height:7px;overflow:hidden;}
.prog-bar{height:100%;border-radius:99px;background:var(--red);transition:width .5s;}
.score-nums{text-align:right;font-size:.75rem;color:var(--text2);margin-top:4px;}

/* category select */
.sel-tb{display:flex;justify-content:space-between;align-items:center;padding:2px 0 10px;}
.sel-info{font-size:.82rem;color:var(--text2);}
.link-row{display:flex;gap:8px;}
.link-btn{background:none;border:none;color:var(--red);font-size:.82rem;font-weight:600;cursor:pointer;}
.cat-list{flex:1;overflow-y:auto;}
.cat-item{display:flex;align-items:center;gap:10px;padding:13px 10px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s;border-radius:8px;}
.cat-item:hover{background:var(--red-l);}
.cat-item.selected{background:var(--red-l);border-left:3px solid var(--red);padding-left:7px;}
.cat-chk{width:18px;height:18px;accent-color:var(--red);cursor:pointer;flex-shrink:0;}
.cat-info{flex:1;min-width:0;}
.cat-name{font-weight:600;font-size:.92rem;}
.cat-meta{font-size:.74rem;color:var(--text2);margin-top:2px;}
.cat-chip{font-size:.72rem;padding:2px 8px;border-radius:99px;background:#f0f0f0;color:var(--text2);white-space:nowrap;flex-shrink:0;}
.cat-chip.ok{background:#dcfce7;color:#166534;}
.start-btn{background:var(--red);color:white;border:none;border-radius:12px;padding:15px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:14px;transition:background .18s;}
.start-btn:hover{background:var(--red-d);}
.start-btn:disabled{background:#ccc;cursor:not-allowed;}

/* word list */
.tab-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;}
.tab-scroll::-webkit-scrollbar{height:3px;}
.tab-scroll::-webkit-scrollbar-thumb{background:#ddd;border-radius:99px;}
.cat-tab{background:white;border:2px solid var(--bdr);border-radius:99px;padding:5px 13px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;}
.cat-tab:hover{border-color:var(--red);}
.cat-tab.active{background:var(--red);color:white;border-color:var(--red);}
.wl-meta{font-size:.78rem;color:var(--text2);font-weight:600;padding:4px 0 8px;}
.word-grid{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.word-row{background:white;border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.wid{font-size:.68rem;color:#ccc;width:28px;text-align:right;flex-shrink:0;}
.wjp{font-size:1.2rem;font-weight:700;}
.wrd{font-size:.76rem;color:var(--text2);}
.wmean{font-size:.84rem;color:#555;text-align:right;flex:1;}
.speak-sm{background:none;border:none;font-size:1rem;cursor:pointer;opacity:.55;padding:2px;}
.speak-sm:hover{opacity:1;}

/* exercise */
#screen-exercise{padding:12px 20px 20px;}
.ex-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ex-prog-txt{font-size:.84rem;color:var(--text2);font-weight:700;}
.quit-btn{background:none;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;font-size:.78rem;color:var(--text2);cursor:pointer;}
.quit-btn:hover{border-color:var(--red);color:var(--red);}
.card-scene{perspective:900px;height:260px;margin-bottom:18px;}
.flip-card{width:100%;height:100%;position:relative;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;-webkit-transition:-webkit-transform .55s;transition:transform .55s;}
.flip-card.flipped{-webkit-transform:rotateY(180deg);transform:rotateY(180deg);}
.card-face{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;}
.cf{background:white;border:2px solid var(--bdr);box-shadow:var(--shd);}
.cb{background:var(--red-l);border:2px solid var(--red);box-shadow:var(--shd);-webkit-transform:rotateY(180deg);transform:rotateY(180deg);}
.fp-prompt{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:6px;}
.fp-meaning{font-size:1.75rem;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:18px;}
.fp-audio-btn{background:var(--red);color:white;border:none;border-radius:99px;padding:9px 20px;font-size:.88rem;cursor:pointer;transition:background .18s;}
.fp-audio-btn:hover{background:var(--red-d);}
.bp-word{font-size:2.8rem;font-weight:700;color:var(--red);line-height:1.1;margin-bottom:8px;background:rgba(220,20,60,0.06);padding:8px 24px;border-radius:12px;border:1.5px solid rgba(220,20,60,0.18);}
.bp-reading{font-size:1rem;color:var(--text2);margin-bottom:10px;}
.bp-meaning{font-size:1.05rem;font-weight:600;color:var(--text);}
.bp-ua{margin-top:10px;padding:6px 14px;background:rgba(0,0,0,0.05);border-radius:8px;font-size:.82rem;color:var(--text2);}
.bp-ua .match{color:var(--grn);font-weight:700;}
.bp-ua .nomatch{color:var(--err);}
.ans-area{margin-bottom:12px;}
.ans-input{width:100%;padding:13px 16px;font-size:1.1rem;border:2px solid var(--bdr);border-radius:12px;outline:none;transition:border-color .18s;background:white;font-family:inherit;}
.ans-input:focus{border-color:var(--red);}
.ans-input:disabled{opacity:.6;cursor:not-allowed;}
.confirm-btn{width:100%;padding:15px;background:var(--red);color:white;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .18s;}
.confirm-btn:hover{background:var(--red-d);}
.judge-row{display:none;grid-template-columns:1fr 1fr;gap:10px;}
.judge-row.vis{display:grid;}
.jbtn{padding:15px;border:2px solid;border-radius:12px;font-size:.98rem;font-weight:700;cursor:pointer;transition:all .18s;}
.jok{background:#dcfce7;color:#166534;border-color:#86efac;}
.jok:hover{background:var(--grn);color:white;border-color:var(--grn);}
.jno{background:#fee2e2;color:#991b1b;border-color:#fca5a5;}
.jno:hover{background:var(--err);color:white;border-color:var(--err);}

/* results */
.res-hero{text-align:center;padding:24px 0 16px;}
.res-trophy{font-size:3.2rem;}
.res-title{font-size:1.4rem;font-weight:800;margin:8px 0 2px;}
.res-score{font-size:3rem;font-weight:900;color:var(--red);line-height:1;}
.res-pct{font-size:.92rem;color:var(--text2);margin-top:4px;}
.res-bd{background:white;border-radius:12px;padding:14px 16px;margin:12px 0;border:2px solid var(--bdr);}
.res-bd h3{font-size:.82rem;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}
.bd-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:.88rem;}
.bd-row:last-child{border-bottom:none;}
.bd-pct{font-weight:700;color:var(--red);}
.res-btns{display:grid;gap:8px;margin-top:auto;padding-top:12px;}
.res-btn{padding:14px;border-radius:12px;border:2px solid var(--bdr);background:white;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .18s;}
.res-btn.pri{background:var(--red);color:white;border-color:var(--red);}
.res-btn:hover{border-color:var(--red);}
.res-btn.pri:hover{background:var(--red-d);}

/* scores */
.sc-wrap{overflow-y:auto;flex:1;}
.sc-item{background:white;border:1px solid var(--bdr);border-radius:12px;padding:13px 14px;margin-bottom:8px;}
.sc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.sc-name{font-weight:600;font-size:.88rem;}
.sc-pct{font-weight:700;color:var(--red);font-size:.95rem;}
.sc-nums{font-size:.74rem;color:var(--text2);margin-top:4px;}

@media(max-width:400px){.fp-meaning{font-size:1.4rem;}.bp-word{font-size:2.2rem;}.mode-btn{padding:14px 8px;}}
</style>
</head>
<body>
<div id="app">

<div id="screen-home" class="screen active">
  <div class="home-hero">
    <div class="ja-sub">JLPT N5 単語練習アプリ</div>
    <h1>日語單字練習</h1>
    <div class="sub">N5 基礎詞彙 · 798 個單字 · 31 個類別</div>
  </div>
  <div id="dbg" style="display:none;background:#ef4444;color:white;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;word-break:break-all"></div><div id="js-ok" onclick="this.style.background='#10b981';this.textContent='✓ onclick works — tap a mode button now'" style="background:#f59e0b;color:white;padding:10px 14px;border-radius:8px;font-size:13px;text-align:center;margin-bottom:10px;cursor:pointer">Tap here first to test JavaScript</div><div class="mode-grid">
    <button class="mode-btn" onclick="goSelect('single')"><div class="m-icon">📁</div><div class="m-label">按分類練習</div><div class="m-desc">選擇單一類別</div></button>
    <button class="mode-btn" onclick="goSelect('mix')"><div class="m-icon">🎯</div><div class="m-label">混合分類</div><div class="m-desc">選擇多個類別</div></button>
    <button class="mode-btn" onclick="startSeq()"><div class="m-icon">📝</div><div class="m-label">按順序練習</div><div class="m-desc">全部 1–800 順序</div></button>
    <button class="mode-btn" onclick="startRandom()"><div class="m-icon">🔀</div><div class="m-label">隨機練習</div><div class="m-desc">全部隨機打亂</div></button>
  </div>
  <div class="sec-row">
    <button class="sec-btn" onclick="nav('screen-word-list');initWL()">📚 瀏覽單字表</button>
    <button class="sec-btn" onclick="nav('screen-scores');renderScores()">🏆 查看成績</button>
  </div>
  <div class="home-score" id="home-score-box"></div>
</div>

<div id="screen-category-select" class="screen">
  <div class="hdr">
    <button class="back-btn" onclick="nav('screen-home')">&#8592;</button>
    <h2 id="sel-title">選擇類別</h2>
  </div>
  <div class="sel-tb">
    <div class="sel-info" id="sel-info"></div>
    <div class="link-row" id="sel-links"></div>
  </div>
  <div class="cat-list" id="cat-list"></div>
  <button class="start-btn" id="sel-start-btn" onclick="startFromSel()" style="display:none">開始練習</button>
</div>

<div id="screen-word-list" class="screen">
  <div class="hdr">
    <button class="back-btn" onclick="nav('screen-home')">&#8592;</button>
    <h2>瀏覽單字表</h2>
  </div>
  <div class="tab-scroll" id="wl-tabs"></div>
  <div class="wl-meta" id="wl-meta"></div>
  <div class="word-grid" id="wl-words"></div>
</div>

<div id="screen-exercise" class="screen">
  <div class="ex-top">
    <div class="ex-prog-txt" id="ex-prog"></div>
    <button class="quit-btn" onclick="quitEx()">結束練習</button>
  </div>
  <div class="prog-wrap" style="margin-bottom:16px"><div class="prog-bar" id="ex-bar" style="width:0%"></div></div>
  <div class="card-scene">
    <div class="flip-card" id="flip-card">
      <div class="card-face cf">
        <div class="fp-prompt">看中文 &#8594; 說 / 寫日文</div>
        <div class="fp-meaning" id="fp-meaning">---</div>
        <button class="fp-audio-btn" onclick="speakNow()">&#128266; 再聽一次</button>
      </div>
      <div class="card-face cb">
        <div class="bp-word" id="bp-word">---</div>
        <div class="bp-reading" id="bp-reading"></div>
        <div class="bp-meaning" id="bp-meaning">---</div>
        <div class="bp-ua" id="bp-ua" style="display:none"></div>
      </div>
    </div>
  </div>
  <div class="ans-area">
    <input class="ans-input" id="ans-in" type="text" placeholder="請輸入日文（單字或讀音）…">
  </div>
  <button class="confirm-btn" id="confirm-btn" onclick="doFlip()">確認翻牌 &#8594;</button>
  <div class="judge-row" id="judge-row">
    <button class="jbtn jok" onclick="judge(true)">&#10003; 答對了</button>
    <button class="jbtn jno" onclick="judge(false)">&#10007; 答錯了</button>
  </div>
</div>

<div id="screen-results" class="screen">
  <div class="res-hero">
    <div class="res-trophy" id="r-trophy">&#127942;</div>
    <div class="res-title">練習結果</div>
    <div class="res-score" id="r-score">0/0</div>
    <div class="res-pct" id="r-pct">正確率 0%</div>
  </div>
  <div class="res-bd" id="r-bd" style="display:none"><h3>各分類成績</h3><div id="r-bd-rows"></div></div>
  <div class="res-btns">
    <button class="res-btn pri" onclick="doRestart()">再練一次</button>
    <button class="res-btn" onclick="nav('screen-home');updateHomeScore()">返回首頁</button>
  </div>
</div>

<div id="screen-scores" class="screen">
  <div class="hdr">
    <button class="back-btn" onclick="nav('screen-home')">&#8592;</button>
    <h2>學習成績</h2>
  </div>
  <div class="sc-wrap" id="sc-wrap"></div>
</div>

</div>

    for (var wi = 0; wi < cat.words.length; wi++) {
      ALL_WORDS.push(Object.assign({}, cat.words[wi], {catName: cat.name}));
    }
  }
}());

var isMix = false;
var selIds = {};
var exWords = [];
var exIdx = 0;
var exResults = [];
var flipped = false;
var lastWords = null;
var wlCat = 0;

var SK = 'jlpt5_v4';
function getS() {
  try { return JSON.parse(localStorage.getItem(SK)) || {cats:{}, ov:{c:0,t:0}}; }
  catch(e) { return {cats:{}, ov:{c:0,t:0}}; }
}
function saveS(catId, ok) {
  var s = getS();
  if (!s.cats[catId]) s.cats[catId] = {c:0,t:0};
  s.cats[catId].t++;
  if (ok) s.cats[catId].c++;
  s.ov.t++;
  if (ok) s.ov.c++;
  try { localStorage.setItem(SK, JSON.stringify(s)); } catch(e) {}
}
function clearS() { try { localStorage.removeItem(SK); } catch(e) {} }

function nav(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function updateHomeScore() {
  var s = getS();
  var pct = s.ov.t > 0 ? Math.round(s.ov.c / s.ov.t * 100) : 0;
  document.getElementById('home-score-box').innerHTML =
    '<div class="lbl">&#128202; 總體練習紀錄</div>' +
    '<div class="prog-wrap"><div class="prog-bar" style="width:' + pct + '%"></div></div>' +
    '<div class="score-nums">正確 ' + s.ov.c + ' / 已答 ' + s.ov.t + ' &middot; 正確率 ' + pct + '%</div>';
}

function speak(txt) {
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = 'ja-JP'; u.rate = 0.85; u.pitch = 1.0;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function speakNow() { if (exWords[exIdx]) speak(exWords[exIdx].word); }

function goSelect(mode) {
  isMix = (mode === 'mix');
  selIds = {};
  document.getElementById('sel-title').textContent = isMix ? '混合分類（可多選）' : '選擇練習類別';
  document.getElementById('sel-links').innerHTML = isMix
    ? '<button class="link-btn" onclick="selAll(1)">全選</button> <button class="link-btn" onclick="selAll(0)">取消</button>'
    : '';
  var btn = document.getElementById('sel-start-btn');
  btn.style.display = isMix ? 'block' : 'none';
  btn.disabled = true;
  renderCatList();
  nav('screen-category-select');
}

function renderCatList() {
  var s = getS();
  var html = '';
  for (var i = 0; i < CATS.length; i++) {
    var cat = CATS[i];
    var cs = s.cats[cat.id] || {c:0,t:0};
    var pct = cs.t > 0 ? Math.round(cs.c / cs.t * 100) : null;
    var chip = pct !== null ? cs.c + '/' + cs.t + ' (' + pct + '%)' : '未練習';
    var chipCls = cs.t > 0 ? 'cat-chip ok' : 'cat-chip';
    var chk = isMix ? '<input type="checkbox" class="cat-chk" id="ck' + cat.id + '" onclick="event.stopPropagation();togCat(' + cat.id + ')">' : '';
    var fn = isMix ? 'togItem(' + cat.id + ')' : 'startCat(' + cat.id + ')';
    html += '<div class="cat-item" id="ci' + cat.id + '" onclick="' + fn + '">' +
      chk +
      '<div class="cat-info"><div class="cat-name">' + cat.name + '</div>' +
      '<div class="cat-meta">No.' + cat.range + ' &middot; ' + cat.words.length + ' 個單字</div></div>' +
      '<div class="' + chipCls + '">' + chip + '</div></div>';
  }
  document.getElementById('cat-list').innerHTML = html;
  updSelInfo();
}

function togItem(id) {
  var ck = document.getElementById('ck' + id);
  if (ck) ck.checked = !ck.checked;
  togCat(id);
}
function togCat(id) {
  var el = document.getElementById('ci' + id);
  if (selIds[id]) {
    delete selIds[id];
    if (el) el.classList.remove('selected');
  } else {
    selIds[id] = 1;
    if (el) el.classList.add('selected');
  }
  updSelInfo();
}
function selAll(v) {
  for (var i = 0; i < CATS.length; i++) {
    var id = CATS[i].id;
    var ck = document.getElementById('ck' + id);
    var el = document.getElementById('ci' + id);
    if (ck) ck.checked = !!v;
    if (v) { selIds[id] = 1; if (el) el.classList.add('selected'); }
    else { delete selIds[id]; if (el) el.classList.remove('selected'); }
  }
  updSelInfo();
}
function updSelInfo() {
  var keys = Object.keys(selIds);
  var n = keys.length;
  if (!isMix) { document.getElementById('sel-info').textContent = '點選類別即可開始'; return; }
  var wn = 0;
  for (var i = 0; i < CATS.length; i++) {
    if (selIds[CATS[i].id]) wn += CATS[i].words.length;
  }
  document.getElementById('sel-info').textContent = '已選 ' + n + ' 類 &middot; ' + wn + ' 個單字';
  var btn = document.getElementById('sel-start-btn');
  btn.disabled = (n === 0);
  btn.textContent = n > 0 ? '開始練習（' + n + ' 類 · ' + wn + ' 字）' : '開始練習';
}

function startCat(id) {
  var cat = null;
  for (var i = 0; i < CATS.length; i++) { if (CATS[i].id === id) { cat = CATS[i]; break; } }
  if (!cat) return;
  var words = [];
  for (var j = 0; j < cat.words.length; j++) words.push(Object.assign({}, cat.words[j], {catName: cat.name}));
  lastWords = words;
  beginEx(words);
}
function startFromSel() {
  var words = [];
  for (var i = 0; i < CATS.length; i++) {
    if (selIds[CATS[i].id]) {
      for (var j = 0; j < CATS[i].words.length; j++) words.push(Object.assign({}, CATS[i].words[j], {catName: CATS[i].name}));
    }
  }
  lastWords = words;
  beginEx(words);
}
function startSeq() {
  var words = [];
  for (var i = 0; i < ALL_WORDS.length; i++) words.push(Object.assign({}, ALL_WORDS[i]));
  lastWords = words;
  beginEx(words);
}
function startRandom() {
  var words = [];
  for (var i = 0; i < ALL_WORDS.length; i++) words.push(Object.assign({}, ALL_WORDS[i]));
  for (var i = words.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = words[i]; words[i] = words[j]; words[j] = tmp;
  }
  lastWords = words;
  beginEx(words);
}

function beginEx(words) {
  exWords = words; exIdx = 0; exResults = [];
  nav('screen-exercise');
  showCard();
}

function showCard() {
  var w = exWords[exIdx];
  var tot = exWords.length;
  document.getElementById('ex-prog').textContent = (exIdx + 1) + ' / ' + tot;
  document.getElementById('ex-bar').style.width = Math.round(exIdx / tot * 100) + '%';
  flipped = false;
  document.getElementById('flip-card').classList.remove('flipped');
  document.getElementById('fp-meaning').textContent = w.meaning;
  document.getElementById('bp-word').textContent = w.word;
  document.getElementById('bp-reading').textContent = w.reading !== w.word ? '（' + w.reading + '）' : '';
  document.getElementById('bp-meaning').textContent = w.meaning;
  var ua = document.getElementById('bp-ua');
  ua.style.display = 'none'; ua.innerHTML = '';
  var inp = document.getElementById('ans-in');
  inp.value = ''; inp.disabled = false;
  document.getElementById('confirm-btn').style.display = 'block';
  document.getElementById('judge-row').classList.remove('vis');
  setTimeout(function() { speak(w.word); }, 350);
  setTimeout(function() { try { inp.focus(); } catch(e) {} }, 450);
}

function doFlip() {
  if (flipped) return;
  flipped = true;
  var w = exWords[exIdx];
  var userAns = document.getElementById('ans-in').value.replace(/^\s+|\s+$/g, '');
  function norm(s) { return s.replace(/\s/g, '').toLowerCase(); }
  var match = userAns.length > 0 && (norm(userAns) === norm(w.word) || norm(userAns) === norm(w.reading));
  var ua = document.getElementById('bp-ua');
  if (userAns.length > 0) {
    ua.style.display = 'block';
    ua.innerHTML = '你的答案：<span class="' + (match ? 'match' : 'nomatch') + '">' + userAns + '</span>';
  }
  document.getElementById('flip-card').classList.add('flipped');
  document.getElementById('ans-in').disabled = true;
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('judge-row').classList.add('vis');
  setTimeout(function() { speak(w.word); }, 600);
}

function judge(ok) {
  var w = exWords[exIdx];
  exResults.push({catId: w.catId, catName: w.catName, ok: ok});
  saveS(w.catId, ok);
  exIdx++;
  if (exIdx >= exWords.length) {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e) {}
    showResults();
  } else {
    flipped = false;
    document.getElementById('flip-card').classList.remove('flipped');
    setTimeout(showCard, 280);
  }
}

function quitEx() {
  if (confirm('確定要結束練習嗎？')) {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e) {}
    nav('screen-home');
    updateHomeScore();
  }
}
function doRestart() {
  if (lastWords) {
    var w = [];
    for (var i = 0; i < lastWords.length; i++) w.push(Object.assign({}, lastWords[i]));
    beginEx(w);
  } else { nav('screen-home'); }
}

function showResults() {
  nav('screen-results');
  var corr = 0;
  for (var i = 0; i < exResults.length; i++) { if (exResults[i].ok) corr++; }
  var tot = exResults.length;
  var pct = tot > 0 ? Math.round(corr / tot * 100) : 0;
  document.getElementById('r-score').textContent = corr + ' / ' + tot;
  document.getElementById('r-pct').textContent = '正確率 ' + pct + '%';
  document.getElementById('r-trophy').textContent = pct >= 90 ? '🏆' : pct >= 70 ? '🥈' : pct >= 50 ? '🥉' : '📝';
  var catMap = {};
  for (var i = 0; i < exResults.length; i++) {
    var r = exResults[i];
    if (!catMap[r.catId]) catMap[r.catId] = {name: r.catName, c: 0, t: 0};
    catMap[r.catId].t++;
    if (r.ok) catMap[r.catId].c++;
  }
  var keys = Object.keys(catMap);
  var bd = document.getElementById('r-bd');
  if (keys.length > 1) {
    bd.style.display = 'block';
    var rows = '';
    for (var ki = 0; ki < keys.length; ki++) {
      var d = catMap[keys[ki]];
      rows += '<div class="bd-row"><div>' + d.name + '</div><div><span class="bd-pct">' +
        Math.round(d.c / d.t * 100) + '%</span> (' + d.c + '/' + d.t + ')</div></div>';
    }
    document.getElementById('r-bd-rows').innerHTML = rows;
  } else { bd.style.display = 'none'; }
  updateHomeScore();
}

function initWL() {
  wlCat = 0;
  renderWLTabs();
  renderWLWords(CATS[0]);
}
function renderWLTabs() {
  var html = '';
  for (var i = 0; i < CATS.length; i++) {
    var c = CATS[i];
    var sn = c.name.split('：').pop().split('、')[0];
    if (sn.length > 6) sn = sn.substring(0, 6);
    html += '<button class="cat-tab' + (i === wlCat ? ' active' : '') + '" onclick="switchWL(' + i + ')">' + c.id + '. ' + sn + '</button>';
  }
  document.getElementById('wl-tabs').innerHTML = html;
}
function switchWL(i) { wlCat = i; renderWLTabs(); renderWLWords(CATS[i]); }
function renderWLWords(cat) {
  document.getElementById('wl-meta').textContent = cat.name + ' · No.' + cat.range + ' · ' + cat.words.length + ' 個單字';
  var html = '';
  for (var i = 0; i < cat.words.length; i++) {
    var w = cat.words[i];
    var rdg = w.reading !== w.word ? '<div class="wrd">' + w.reading + '</div>' : '';
    var sw = w.word.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    html += '<div class="word-row"><div class="wid">' + w.id + '</div>' +
      '<div style="flex:1;min-width:0"><div class="wjp">' + w.word + '</div>' + rdg + '</div>' +
      '<div class="wmean">' + w.meaning + '</div>' +
      '<button class="speak-sm" onclick="speak(\'' + sw + '\')">&#128266;</button></div>';
  }
  document.getElementById('wl-words').innerHTML = html;
}

function renderScores() {
  var s = getS();
  var op = s.ov.t > 0 ? Math.round(s.ov.c / s.ov.t * 100) : 0;
  var h = '<div class="sc-item" style="border-color:var(--red);border-width:2px">' +
    '<div class="sc-hdr"><div class="sc-name" style="font-size:1rem">&#127942; 全體總成績</div><div class="sc-pct">' + op + '%</div></div>' +
    '<div class="prog-wrap"><div class="prog-bar" style="width:' + op + '%"></div></div>' +
    '<div class="sc-nums">正確 ' + s.ov.c + ' / 已答 ' + s.ov.t + '</div></div>';
  for (var i = 0; i < CATS.length; i++) {
    var cat = CATS[i];
    var cs = s.cats[cat.id] || {c:0,t:0};
    var pct = cs.t > 0 ? Math.round(cs.c / cs.t * 100) : 0;
    var col = pct >= 80 ? 'var(--grn)' : pct >= 50 ? 'var(--ylw)' : 'var(--red)';
    h += '<div class="sc-item"><div class="sc-hdr"><div class="sc-name">' + cat.name + '</div>' +
      '<div class="sc-pct">' + (cs.t > 0 ? pct + '%' : '--') + '</div></div>' +
      '<div class="prog-wrap"><div class="prog-bar" style="width:' + pct + '%;background:' + col + '"></div></div>' +
      '<div class="sc-nums">No.' + cat.range + ' &middot; 正確 ' + cs.c + ' / 已答 ' + cs.t + ' / 共 ' + cat.words.length + ' 字</div></div>';
  }
  h += '<div style="padding:12px 4px"><button onclick="doClearScores()" style="background:none;border:none;color:var(--err);font-size:.82rem;cursor:pointer;text-decoration:underline">清除所有成績紀錄</button></div>';
  document.getElementById('sc-wrap').innerHTML = h;
}

function doClearScores() {
  if (confirm("確定清除所有成績嗎？")) { clearS(); renderScores(); updateHomeScore(); }
}

document.getElementById('ans-in').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) doFlip();
});

updateHomeScore();
var _ok = document.getElementById('js-ok');
if (_ok) _ok.style.background = '#6b7280';
</script>
</body>
</html>
